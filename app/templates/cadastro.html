{% extends 'base.html' %}

{% block content %}

<div class="form-card">

    <h1>Criar Conta</h1>

    <p>
        Cadastre-se para começar a controlar suas finanças.
    </p>

    <form>

        <div class="form-group">

            <input
                type="text"
                class="input-field"
                placeholder="Nome completo"
                required>

        </div>

        <div class="form-group">

            <input
                type="email"
                class="input-field"
                placeholder="E-mail"
                required>

        </div>

        <div class="form-group">

            <input
                type="tel"
                class="input-field"
                placeholder="Celular / WhatsApp"
                required>

        </div>

        <div class="form-group">

            <input
                type="password"
                class="input-field"
                placeholder="Senha"
                required>

        </div>

        <div class="form-group">

            <input
                type="password"
                class="input-field"
                placeholder="Confirmar Senha"
                required>

        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="btn-primary">
                Criar Conta
            </button>

        </div>

    </form>

    <div class="form-links">

        <p>
            Já possui uma conta?
        </p>

                    <a href="{{ url_for('login') }}" class="register-link"> Entrar </a>

    </div>

</div>

{% endblock %}
