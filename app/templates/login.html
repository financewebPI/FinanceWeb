{% extends 'base.html' %}

{% block content %}

<div class="form-card">

    <h1>Entrar</h1>

    <p> Acesse sua conta para gerenciar suas finanças. </p>

    <form>

        <div class="form-group">

            <input type="email" class="input-field" placeholder="Digite seu e-mail" >

        </div>

        <div class="form-group">

             <input type="password" class="input-field" placeholder="Digite sua senha" >

        </div>

        <div class="form-actions">

        <a href # class="btn-secondary"> Entrar </a>    
     
        </div>

        <div class="form-links">

            <a href # class="form-link"> Esqueci minha senha </a>
            
            <p> Ainda não possui conta? </p>

            <a href="{{ url_for('cadastro') }}" class="register-link"> Criar uma conta </a>
       
        </div>

    </form>

</div>

{% endblock %}
