{% extends 'base.html' %}

{% block content %}

<div class="form-card">

    <h1>Editar Receita</h1>

    <p>
        Atualize os dados da receita.
    </p>

    <form method="POST">

        <div class="form-group">

            <input
                type="text"
                name="descricao"
                class="input-field"
                value="{{ receita[1] }}"
                required>

        </div>

        <div class="form-group">

            <select
                name="categoria"
                class="input-field"
                required>

                <option value="Salário"
                    {% if receita[2] == "Salário" %}selected{% endif %}>
                    Salário
                </option>

                <option value="13° Salário"
                    {% if receita[2] == "13° Salário" %}selected{% endif %}>
                    13° Salário
                </option>

                <option value="PLR"
                    {% if receita[2] == "PLR" %}selected{% endif %}>
                    PLR
                </option>

                <option value="Freelance"
                    {% if receita[2] == "Freelance" %}selected{% endif %}>
                    Freelance
                </option>

                <option value="Comissão"
                    {% if receita[2] == "Comissão" %}selected{% endif %}>
                    Comissão
                </option>

                <option value="Investimentos"
                    {% if receita[2] == "Investimentos" %}selected{% endif %}>
                    Investimentos
                </option>

                <option value="Aluguel Recebido"
                    {% if receita[2] == "Aluguel Recebido" %}selected{% endif %}>
                    Aluguel Recebido
                </option>

                <option value="Presentes"
                    {% if receita[2] == "Presentes" %}selected{% endif %}>
                    Presentes
                </option>

                <option value="Outros"
                    {% if receita[2] == "Outros" %}selected{% endif %}>
                    Outros
                </option>

            </select>

        </div>

        <div class="form-group">

            <input
                type="number"
                step="0.01"
                name="valor"
                class="input-field"
                value="{{ receita[3] }}"
                required>

        </div>

        <div class="form-group">

            <input
                type="date"
                name="data_recebimento"
                class="input-field"
                value="{{ receita[4] }}"
                required>

        </div>

        <div class="form-group">

            <label>

                <input
                   
                    type="checkbox"
                    name="recorrente">

                Receita Recorrente

            </label>

        </div>

        <div class="form-group">

            <textarea
                name="observacao"
                class="input-field"
                rows="4"
                placeholder="Observações (Opcional)"></textarea>

        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-positivo">

                Salvar Receita

            </button>

        </div>

    </form>

{% endblock %}
